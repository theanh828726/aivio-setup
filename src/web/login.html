<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="application-name" content="aivio-setup" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Đăng nhập — Học Viện Đào Tạo AI</title>
  <link rel="icon" type="image/svg+xml" href="/aivio-logo.svg" />
  <style>
    :root {
      --navy: #03045e;
      --navy-2: #1a1c7a;
      --frost: #90e0ef;
      --mint: #d8f3dc;
      --paper: #f5f7fb;
      --surface: #ffffff;
      --line: #dfe3ee;
      --ink: #0f1233;
      --muted: #5b6178;
      --bad: #b42318;
      --bad-bg: #fef3f2;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #070a24;
        --surface: #0f143a;
        --line: #252c5e;
        --ink: #eef0fb;
        --muted: #a3a9c9;
        --navy: #90e0ef;
        --navy-2: #b9eef7;
        --bad: #fda29b;
        --bad-bg: #3a1218;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Be Vietnam Pro', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    main { width: 100%; max-width: 380px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 32px 28px 28px;
    }
    .mark { display: block; width: 52px; height: 52px; margin: 0 auto 16px; }
    h1 { margin: 0; text-align: center; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
    .sub { margin: 6px 0 24px; text-align: center; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }
    input:focus-visible { outline: 3px solid color-mix(in srgb, var(--frost) 70%, transparent); outline-offset: 1px; border-color: var(--navy); }
    button {
      width: 100%;
      height: 46px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: var(--navy);
      color: var(--surface);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--navy-2); }
    button:focus-visible { outline: 3px solid var(--frost); outline-offset: 2px; }
    button[disabled] { opacity: .6; cursor: progress; }
    .error {
      display: none;
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bad-bg);
      color: var(--bad);
      font-size: 14px;
    }
    .error.show { display: block; }
    footer { margin-top: 18px; text-align: center; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <form class="card" id="login" autocomplete="on">
      <img class="mark" src="/aivio-logo.svg" alt="" />
      <h1>Đăng nhập quản lý bot</h1>
      <p class="sub">Học Viện Đào Tạo AI</p>
      <input type="text" name="username" value="admin" autocomplete="username" hidden aria-hidden="true" />
      <label for="password">Mật khẩu quản trị</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="submit">Đăng nhập</button>
    </form>
    <footer>Vận hành bởi <a href="https://hocvienai.com" target="_blank" rel="noopener">Học Viện Đào Tạo AI</a></footer>
  </main>
  <script>
    (function () {
      var form = document.getElementById('login');
      var error = document.getElementById('error');
      var submit = document.getElementById('submit');
      function show(msg) { error.textContent = msg; error.classList.add('show'); }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        error.classList.remove('show');
        submit.disabled = true;
        submit.textContent = 'Đang đăng nhập…';
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: form.password.value }),
          credentials: 'same-origin'
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) { return { res: res, data: data }; });
        }).then(function (r) {
          if (r.res.ok) {
            var next = new URLSearchParams(location.search).get('next') || '/';
            if (!/^\/(?!\/)/.test(next)) next = '/';
            // The server never sees the #page part, so carry it over from this URL.
            if (location.hash && next.indexOf('#') < 0) next += location.hash;
            location.replace(next);
            return;
          }
          show(r.data.error || 'Không đăng nhập được. Thử lại sau ít phút.');
          form.password.select();
        }).catch(function () {
          show('Không kết nối được tới máy chủ. Kiểm tra mạng rồi thử lại.');
        }).then(function () {
          submit.disabled = false;
          submit.textContent = 'Đăng nhập';
        });
      });
    })();
  </script>
</body>
</html>
